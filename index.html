<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOVA">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.png">

  <title>NOVA</title>

  <style>
   :root{
      --bg:#030712;
      --blue:#38bdf8;
      --cyan:#67e8f9;
      --violet:#a78bfa;
      --white:#e8f5ff;
      --muted:#66809a;
      --panel:#07111f;
      --line:#10253a;
    }
/* =========================
   AMÉLIORATIONS NOVA
========================= */

.panel{
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      rgba(11,31,53,.94),
      rgba(5,12,25,.96) 55%,
      rgba(24,15,53,.88)
    );
  box-shadow:
    0 18px 55px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.panel::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      115deg,
      transparent 0%,
      rgba(103,232,249,.08) 42%,
      transparent 58%
    );
  transform:translateX(-120%);
  transition:transform .7s ease;
}

.panel:hover::before{
  transform:translateX(120%);
}

.icon-btn,
.send-btn,
.toggle,
.quick{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:
    linear-gradient(
      135deg,
      rgba(21,56,83,.96),
      rgba(8,21,38,.98) 52%,
      rgba(44,24,77,.9)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 7px 20px rgba(0,0,0,.22);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease,
    color .2s ease;
}

.icon-btn::before,
.send-btn::before,
.toggle::before,
.quick::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-80%;
  width:45%;
  background:
    linear-gradient(
      105deg,
      transparent,
      rgba(255,255,255,.28),
      transparent
    );
  transform:skewX(-20deg);
  transition:left .55s ease;
  pointer-events:none;
}

.icon-btn:hover::before,
.send-btn:hover::before,
.toggle:hover::before,
.quick:hover::before{
  left:135%;
}

.icon-btn:hover,
.send-btn:hover,
.toggle:hover,
.quick:hover{
  border-color:rgba(103,232,249,.75);
  color:var(--cyan);
  box-shadow:
    0 0 20px rgba(56,189,248,.2),
    inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(-2px);
}

.send-btn{
  background:
    linear-gradient(
      135deg,
      rgba(14,116,144,.95),
      rgba(37,99,235,.9),
      rgba(124,58,237,.9)
    );
  border-color:rgba(103,232,249,.5);
}

.toggle.on{
  background:
    linear-gradient(
      135deg,
      rgba(8,96,125,.92),
      rgba(21,74,117,.92),
      rgba(76,29,149,.88)
    );
  border-color:rgba(103,232,249,.7);
  color:var(--cyan);
  box-shadow:
    0 0 18px rgba(56,189,248,.16),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.quick{
  cursor:pointer;
}

.icon-btn.active{
  animation:
    microphoneGlow 1.4s ease-in-out infinite;
  background:
    linear-gradient(
      135deg,
      rgba(8,145,178,.95),
      rgba(37,99,235,.92),
      rgba(124,58,237,.9)
    );
}

@keyframes microphoneGlow{
  0%,100%{
    box-shadow:
      0 0 10px rgba(56,189,248,.3),
      inset 0 1px 0 rgba(255,255,255,.12);
  }

  50%{
    box-shadow:
      0 0 30px rgba(103,232,249,.7),
      0 0 55px rgba(56,189,248,.25),
      inset 0 1px 0 rgba(255,255,255,.16);
  }
}

.core-ring{
  background:
    radial-gradient(
      circle,
      rgba(103,232,249,.1),
      transparent 42%
    );
  animation:corePulse 3.2s ease-in-out infinite;
}

@keyframes corePulse{
  0%,100%{
    box-shadow:
      0 0 32px rgba(56,189,248,.1),
      inset 0 0 24px rgba(56,189,248,.08);
  }

  50%{
    box-shadow:
      0 0 55px rgba(56,189,248,.27),
      0 0 90px rgba(167,139,250,.12),
      inset 0 0 32px rgba(56,189,248,.16);
  }
}

.bubble{
  background:
    linear-gradient(
      135deg,
      rgba(10,29,48,.92),
      rgba(8,15,31,.88)
    );
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 8px 25px rgba(0,0,0,.18);
}

.user .bubble{
  background:
    linear-gradient(
      135deg,
      rgba(8,61,91,.82),
      rgba(18,30,62,.88)
    );
  border-color:rgba(56,189,248,.38);
}

.quick:active,
.toggle:active,
.icon-btn:active,
.send-btn:active{
  transform:translateY(1px) scale(.98);
}

.refresh{
  padding:5px 8px;
  border-radius:8px;
  transition:
    color .2s ease,
    background .2s ease;
}

.refresh:hover{
  color:white;
  background:rgba(103,232,249,.1);
}

.status{
  text-shadow:0 0 12px rgba(103,232,249,.12);
}

.footer{
  opacity:.85;
}

    
    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--white);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,
        BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    body{
      overflow-x:hidden;
    }

    button,input{
      font:inherit;
    }

    .shell{
      width:min(760px,100%);
      min-height:100vh;
      margin:auto;
      padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
      position:relative;
    }

    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(56,189,248,.09),
          transparent 25%
        ),
        linear-gradient(
          rgba(56,189,248,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(56,189,248,.025) 1px,
          transparent 1px
        );
      background-size:auto,34px 34px,34px 34px;
    }

    .topbar{
      height:70px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
      position:relative;
      z-index:2;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .brand-mark{
      width:28px;
      height:28px;
      border:1px solid rgba(103,232,249,.75);
      border-radius:50%;
      position:relative;
      box-shadow:0 0 18px rgba(56,189,248,.22);
    }

    .brand-mark:before,
    .brand-mark:after{
      content:"";
      position:absolute;
      inset:6px;
      border:1px solid rgba(56,189,248,.55);
      border-radius:50%;
    }

    .brand-mark:after{
      inset:12px;
      background:var(--cyan);
      border:0;
      box-shadow:0 0 10px var(--cyan);
    }

    .brand-name{
      letter-spacing:.24em;
      font-size:15px;
      font-weight:700;
    }

    .status{
      font-size:11px;
      letter-spacing:.15em;
      color:var(--muted);
      text-transform:uppercase;
    }

    .core{
      padding:22px 0 10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      position:relative;
      z-index:2;
    }

    .core-ring{
      width:150px;
      height:150px;
      border-radius:50%;
      border:1px solid rgba(56,189,248,.4);
      box-shadow:
        0 0 32px rgba(56,189,248,.10),
        inset 0 0 24px rgba(56,189,248,.08);
      display:grid;
      place-items:center;
      position:relative;
    }

    .core-ring:before{
      content:"";
      position:absolute;
      inset:14px;
      border-radius:50%;
      border:1px solid rgba(167,139,250,.45);
      animation:spin 11s linear infinite;
    }

    .core-ring:after{
      content:"N";
      font-size:40px;
      letter-spacing:.05em;
      color:var(--cyan);
      text-shadow:0 0 18px rgba(103,232,249,.5);
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .state{
      margin-top:13px;
      font-size:11px;
      letter-spacing:.22em;
      color:var(--muted);
      text-transform:uppercase;
    }

    .state.active{
      color:var(--cyan);
      text-shadow:0 0 12px rgba(103,232,249,.32);
    }

    .panel{
      border:1px solid var(--line);
      background:
        linear-gradient(
          180deg,
          rgba(7,17,31,.82),
          rgba(4,11,21,.93)
        );
      border-radius:18px;
      box-shadow:0 15px 45px rgba(0,0,0,.25);
      position:relative;
      z-index:2;
    }

    .chat-panel{
      height:min(49vh,500px);
      min-height:280px;
      overflow:auto;
      padding:14px;
      margin-top:10px;
    }

    .empty{
      height:100%;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.05em;
      text-align:center;
    }

    .row{
      display:flex;
      margin:10px 0;
    }

    .row.user{
      justify-content:flex-end;
    }

    .bubble{
      max-width:86%;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:rgba(7,17,31,.72);
      font-size:14px;
      line-height:1.45;
    }

    .user .bubble{
      border-color:rgba(56,189,248,.22);
      background:rgba(10,31,48,.78);
    }

    .meta{
      font-size:9px;
      color:var(--muted);
      margin-bottom:4px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .composer{
      position:sticky;
      bottom:0;
      margin-top:12px;
      padding-bottom:10px;
      z-index:3;
    }

    .composer-inner{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:8px;
      padding:9px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(3,7,18,.92);
      backdrop-filter:blur(18px);
    }

    .icon-btn,
    .send-btn,
    .toggle{
      height:46px;
      border-radius:13px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--white);
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .icon-btn{
      width:46px;
    }

    .send-btn{
      width:52px;
    }

    .icon-btn.active{
      border-color:rgba(56,189,248,.6);
      box-shadow:0 0 16px rgba(56,189,248,.11);
      color:var(--cyan);
    }

    .composer input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--white);
      padding:0 5px;
      min-width:0;
    }

    .composer input::placeholder{
      color:#49637a;
    }

    .mic-icon{
      width:18px;
      height:18px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
    }

    .send-icon{
      width:19px;
      height:19px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
    }

    .controls{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin:8px 0 12px;
    }

    .toggle{
      padding:0 14px;
      font-size:11px;
      letter-spacing:.11em;
      text-transform:uppercase;
    }

    .toggle.on{
      border-color:rgba(103,232,249,.55);
      color:var(--cyan);
    }

    .dash{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      position:relative;
      z-index:2;
    }

    .dash-card{
      padding:14px;
    }

    .dash-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
    }

    .dash-title{
      font-size:11px;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .refresh{
      color:var(--cyan);
      font-size:10px;
      cursor:pointer;
    }

    .value{
      font-size:24px;
      margin-top:10px;
      font-variant-numeric:tabular-nums;
    }

    .sub{
      font-size:11px;
      color:var(--muted);
      margin-top:5px;
      min-height:18px;
    }

    .market-row{
      display:flex;
      align-items:baseline;
      gap:6px;
      margin-top:10px;
    }

    .market-label{
      font-size:11px;
      color:var(--muted);
    }

    .up{
      color:var(--cyan);
    }

    .down{
      color:#fda4af;
    }

    .quick-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:8px;
    }

    .quick{
      height:40px;
      border:1px solid var(--line);
      border-radius:12px;
      background:rgba(7,17,31,.9);
      color:var(--white);
      font-size:11px;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .quick:active,
    .toggle:active,
    .icon-btn:active,
    .send-btn:active{
      transform:translateY(1px);
    }

    .footer{
      padding:14px 0 22px;
      text-align:center;
      color:#42596e;
      font-size:10px;
      letter-spacing:.08em;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:92px;
      transform:translate(-50%,20px);
      padding:9px 13px;
      border:1px solid rgba(103,232,249,.28);
      border-radius:12px;
      background:rgba(7,17,31,.96);
      color:var(--white);
      font-size:12px;
      opacity:0;
      pointer-events:none;
      transition:.22s;
      z-index:20;
    }

    .toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    @media (max-width:520px){
      .shell{
        padding-left:10px;
        padding-right:10px;
      }

      .core-ring{
        width:128px;
        height:128px;
      }

      .chat-panel{
        height:47vh;
        min-height:260px;
      }

      .dash{
        grid-template-columns:1fr;
      }

      .brand-name{
        font-size:13px;
      }

      .status{
        font-size:9px;
      }
    }

   PATCH LISIBILITÉ NOVA
   ========================= */

  }

  }

</style>
</head>

<body>

<div class="grid"></div>

<div class="shell">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">NOVA</div>
    </div>

    <div class="status" id="statusText">
      SYSTÈME EN LIGNE
    </div>
  </header>

  <section class="core">
    <div class="core-ring" id="coreRing"></div>
    <div class="state" id="stateText">VEILLE</div>
  </section>

  <section class="panel chat-panel" id="chatPanel">

    <div class="empty" id="emptyState">
      NOVA attend une commande.<br>
      Parle, écris ou utilise le mode rapide.
    </div>

    <div id="messages"></div>

  </section>

  <section class="composer">

    <div class="composer-inner panel">

      <button
        class="icon-btn"
        id="micBtn"
        title="Parler à NOVA"
        aria-label="Parler à NOVA"
      >
        <svg class="mic-icon" viewBox="0 0 24 24">
          <rect
            x="8"
            y="3"
            width="8"
            height="12"
            rx="4">
          </rect>

          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"></path>
        </svg>
      </button>

      <input
        id="input"
        type="text"
        autocomplete="off"
        placeholder="Écrire à NOVA…"
      >

      <button
        class="send-btn"
        id="sendBtn"
        title="Envoyer"
        aria-label="Envoyer"
      >
        <svg class="send-icon" viewBox="0 0 24 24">
          <path d="M4 12h15M13 6l6 6-6 6"></path>
        </svg>
      </button>

    </div>

    <div class="controls">

      <button
        class="toggle on"
        id="quickBtn">
        MODE RAPIDE : ON
      </button>

      <button
        class="toggle on"
        id="voiceBtn">
        VOIX : ON
      </button>

    </div>

  </section>

  <section class="dash">

    <!-- MÉTÉO -->

    <div class="panel dash-card">

      <div class="dash-head">
        <div class="dash-title">
          MÉTÉO
        </div>

        <div
          class="refresh"
          id="weatherRefresh">
          ACTUALISER
        </div>
      </div>

      <div
        class="value"
        id="weatherTemp">
        —
      </div>

      <div
        class="sub"
        id="weatherLine">
        Grenoble · récupération…
      </div>

      <div class="quick-grid">

        <button
          class="quick"
          data-weather="Grenoble">
          GRENOBLE
        </button>

        <button
          class="quick"
          data-weather="Paris">
          PARIS
        </button>

      </div>

    </div>

    <!-- BOURSE -->

    <div class="panel dash-card">

      <div class="dash-head">

        <div class="dash-title">
          BOURSE
        </div>

        <div
          class="refresh"
          id="marketRefresh">
          ACTUALISER
        </div>

      </div>

      <div
        class="value"
        id="marketValue">
        —
      </div>

      <div class="market-row">

        <span
          class="market-label"
          id="marketName">
          CAC 40
        </span>

        <span id="marketChange">
          —
        </span>

      </div>

      <div class="quick-grid">

        <button
          class="quick"
          data-market="CAC 40">
          CAC 40
        </button>

        <button
          class="quick"
          data-market="NASDAQ">
          NASDAQ
        </button>

      </div>

    </div>

  </section>

  <div class="footer">
    NOVA · interface mobile 2D · données météo / marché via services externes
  </div>

</div>

<div
  class="toast"
  id="toast">
</div>


<script>

  /* =========================
     ÉTAT NOVA
  ========================= */

  const state = {
    quick: true,
    voice: true,
    listening: false
  };


  /* =========================
     ÉLÉMENTS
  ========================= */

  const input = document.getElementById('input');

  const messages = document.getElementById('messages');

  const emptyState = document.getElementById('emptyState');

  const chatPanel = document.getElementById('chatPanel');

  const micBtn = document.getElementById('micBtn');

  const sendBtn = document.getElementById('sendBtn');

  const quickBtn = document.getElementById('quickBtn');

  const voiceBtn = document.getElementById('voiceBtn');

  const stateText = document.getElementById('stateText');

  const statusText = document.getElementById('statusText');

  const toast = document.getElementById('toast');


  /* =========================
     TOAST
  ========================= */

  function toastMsg(text){

    toast.textContent = text;

    toast.classList.add('show');

    clearTimeout(window._toast);

    window._toast = setTimeout(() => {

      toast.classList.remove('show');

    }, 1800);

  }


  /* =========================
     ÉTAT VISUEL
  ========================= */

  function setState(label, active = false){

    stateText.textContent = label;

    stateText.classList.toggle(
      'active',
      active
    );

  }


  /* =========================
     AJOUT MESSAGE
  ========================= */

  function addMessage(role, text){

    emptyState.style.display = 'none';

    const row = document.createElement('div');

    row.className = 'row ' + role;

    const bubble = document.createElement('div');

    bubble.className = 'bubble';

    const meta = document.createElement('div');

    meta.className = 'meta';

    meta.textContent =
      role === 'user'
        ? 'VOUS'
        : 'NOVA';

    const body = document.createElement('div');

    body.textContent = text;

    bubble.appendChild(meta);

    bubble.appendChild(body);

    row.appendChild(bubble);

    messages.appendChild(row);

    chatPanel.scrollTop =
      chatPanel.scrollHeight;

  }


  /* =========================
     VOIX
  ========================= */

function getBestFrenchVoice(){

  if(!('speechSynthesis' in window)){
    return null;
  }

  const voices =
    window.speechSynthesis.getVoices();

  const frenchVoices =
    voices.filter(voice =>
      voice.lang &&
      voice.lang.toLowerCase().startsWith('fr')
    );

  if(!frenchVoices.length){
    return null;
  }

  const preferredNames = [
    'amélie',
    'amelie',
    'audrey',
    'julie',
    'sophie',
    'marie',
    'alice',
    'claire',
    'camille',
    'virginie',
    'denise',
    'hortense',
    'éloïse',
    'eloise',
    'élise',
    'elise',
    'céline',
    'celine',
    'female',
    'femme'
  ];

  const femaleVoice =
    frenchVoices.find(voice => {

      const voiceName =
        (voice.name || '').toLowerCase();

      return preferredNames.some(name =>
        voiceName.includes(name)
      );

    });

  return femaleVoice || frenchVoices[0];
}


function speak(text){

  if(
    !state.voice ||
    !('speechSynthesis' in window)
  ){
    return;
  }

  try{

    const synth =
      window.speechSynthesis;

    synth.cancel();

    const utterance =
      new SpeechSynthesisUtterance(text);

    const voice =
      getBestFrenchVoice();

    utterance.lang =
      'fr-FR';

    if(voice){
      utterance.voice =
        voice;
    }

    utterance.rate =
      0.88;

    utterance.pitch =
      1.04;

    utterance.volume =
      1;

    synth.speak(
      utterance
    );

  }catch(error){

    console.warn(
      'Synthèse vocale indisponible',
      error
    );

  }

}


  /* =========================
     ENVOI MESSAGE
  ========================= */

  async function sendText(raw){

    const text =
      (raw || '').trim();

    if(!text){
      return;
    }

    input.value = '';

    addMessage(
      'user',
      text
    );

    setState(
      'TRAITEMENT',
      true
    );

    statusText.textContent =
      'NOVA ANALYSE…';


    try{

      const r =
        await fetch(
          '/api/chat',
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({
              text:text,
              device:'iphone',
              fast:state.quick
            })
          }
        );


      const d =
        await r.json();


      if(!r.ok){

        throw new Error(
          d.detail || 'Erreur'
        );

      }


      addMessage(
        'nova',
        d.text
      );


      speak(d.text);


      handleAction(
        d.action
      );


      setState(
        'VEILLE'
      );

      statusText.textContent =
        'SYSTÈME EN LIGNE';


    }catch(e){

      console.error(e);

      addMessage(
        'nova',
        'Je rencontre un problème de connexion.'
      );

      toastMsg(
        'Connexion serveur indisponible'
      );

      setState(
        'ERREUR'
      );

      statusText.textContent =
        'CONNEXION';

    }

  }
if('speechSynthesis' in window){

  speechSynthesis.addEventListener(
    'voiceschanged',
    () => {
      speechSynthesis.getVoices();
    }
  );

}

  /* =========================
     ACTIONS DU SERVEUR
  ========================= */

  function handleAction(a){

    if(!a){
      return;
    }


    /* =====================
       OUVERTURE SITE / APP
    ===================== */

    if(
      a.type === 'open_url' &&
      a.device === 'iphone' &&
      a.url
    ){

      const url = a.url;

      /*
        On laisse iOS gérer le lien HTTPS.
        On ne fait pas de deuxième
        window.location.href.
      */

      const link =
        document.createElement('a');

      link.href = url;

      link.target = '_self';

      link.rel = 'noopener';


      document.body.appendChild(link);


      try{

        link.click();

      }catch(e){

        console.warn(
          'Ouverture du lien impossible',
          e
        );

      }


      setTimeout(() => {

        try{

          link.remove();

        }catch(e){}

      },1500);


      return;
    }


    /* =====================
       MÉTÉO
    ===================== */

    if(
      a.type === 'weather' &&
      a.data
    ){

      showWeather(
        a.data
      );

    }


    /* =====================
       BOURSE
    ===================== */

    if(
      a.type === 'market' &&
      a.data
    ){

      showMarket(
        a.data
      );

    }

  }


  /* =========================
     CLAVIER
  ========================= */

  input.addEventListener(
    'keydown',
    e => {

      if(e.key === 'Enter'){

        sendText(
          input.value
        );

      }

    }
  );


  /* =========================
     BOUTON ENVOYER
  ========================= */

  sendBtn.addEventListener(
    'click',
    () => {

      sendText(
        input.value
      );

    }
  );


  /* =========================
     MODE RAPIDE
  ========================= */

  quickBtn.addEventListener(
    'click',
    () => {

      state.quick =
        !state.quick;

      quickBtn.textContent =
        'MODE RAPIDE : ' +
        (
          state.quick
            ? 'ON'
            : 'OFF'
        );

      quickBtn.classList.toggle(
        'on',
        state.quick
      );

      toastMsg(
        state.quick
          ? 'Mode rapide activé'
          : 'Mode rapide désactivé'
      );

    }
  );


  /* =========================
     VOIX ON / OFF
  ========================= */

  voiceBtn.addEventListener(
    'click',
    () => {

      state.voice =
        !state.voice;

      voiceBtn.textContent =
        'VOIX : ' +
        (
          state.voice
            ? 'ON'
            : 'OFF'
        );

      voiceBtn.classList.toggle(
        'on',
        state.voice
      );

      toastMsg(
        state.voice
          ? 'Voix activée'
          : 'Voix désactivée'
      );

    }
  );


  /* =========================
     RECONNAISSANCE VOCALE
  ========================= */

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = null;


  if(Recognition){

    recognition =
      new Recognition();

    recognition.lang =
      'fr-FR';

    recognition.interimResults =
      false;

    recognition.continuous =
      false;


    recognition.onstart =
      () => {

        state.listening =
          true;

        micBtn.classList.add(
          'active'
        );

        setState(
          'ÉCOUTE',
          true
        );

        statusText.textContent =
          'MICRO ACTIF';

      };


    recognition.onend =
      () => {

        state.listening =
          false;

        micBtn.classList.remove(
          'active'
        );

        if(
          stateText.textContent ===
          'ÉCOUTE'
        ){

          setState(
            'VEILLE'
          );

        }

        statusText.textContent =
          'SYSTÈME EN LIGNE';

      };


    recognition.onerror =
      e => {

        toastMsg(
          'Micro : ' +
          (
            e.error ||
            'indisponible'
          )
        );

      };


    recognition.onresult =
      e => {

        const text =
          e.results?.[0]?.[0]
            ?.transcript || '';

        if(text){

          sendText(
            text
          );

        }

      };

  }


  /* =========================
     BOUTON MICRO
  ========================= */

  micBtn.addEventListener(
    'click',
    () => {

      if(!recognition){

        toastMsg(
          'La dictée vocale du navigateur n’est pas disponible ici.'
        );

        input.focus();

        return;
      }


      try{

        if(state.listening){

          recognition.stop();

        }else{

          recognition.start();

        }

      }catch(e){

        toastMsg(
          'Micro déjà en cours'
        );

      }

    }
  );


  /* =========================
     AFFICHAGE MÉTÉO
  ========================= */

  function showWeather(d){

    document.getElementById(
      'weatherTemp'
    ).textContent =
      (
        d.temperature ??
        '—'
      ) + ' °C';


    document.getElementById(
      'weatherLine'
    ).textContent =
      `${d.city} · ${d.condition} · humidité ${d.humidity ?? '—'} %`;

  }


  /* =========================
     AFFICHAGE BOURSE
  ========================= */

  function showMarket(d){

    document.getElementById(
      'marketName'
    ).textContent =
      d.label;


    document.getElementById(
      'marketValue'
    ).textContent =
      (
        d.price ??
        '—'
      ) +
      (
        d.currency
          ? ' ' + d.currency
          : ''
      );


    const el =
      document.getElementById(
        'marketChange'
      );


    if(
      typeof d.change_pct ===
      'number'
    ){

      el.textContent =
        (
          d.change_pct >= 0
            ? '+'
            : ''
        ) +
        d.change_pct.toFixed(2) +
        ' %';


      el.className =
        d.change_pct >= 0
          ? 'up'
          : 'down';

    }else{

      el.textContent =
        '—';

      el.className =
        '';

    }

  }


  /* =========================
     CHARGEMENT MÉTÉO
  ========================= */

  async function loadWeather(
    city = 'Grenoble'
  ){

    try{

      const r =
        await fetch(
          '/api/weather',
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({
              city:city
            })
          }
        );


      const d =
        await r.json();


      if(!r.ok){

        throw new Error();

      }


      showWeather(
        d
      );


    }catch(e){

      document.getElementById(
        'weatherLine'
      ).textContent =
        'Données indisponibles';

    }

  }


  /* =========================
     CHARGEMENT BOURSE
  ========================= */

  async function loadMarket(
    market = 'CAC 40'
  ){

    try{

      const r =
        await fetch(
          '/api/market',
          {
            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:JSON.stringify({
              market:market
            })
          }
        );


      const d =
        await r.json();


      if(!r.ok){

        throw new Error();

      }


      showMarket(
        d
      );


    }catch(e){

      document.getElementById(
        'marketName'
      ).textContent =
        market;

      document.getElementById(
        'marketValue'
      ).textContent =
        'Indisponible';

      document.getElementById(
        'marketChange'
      ).textContent =
        '';

    }

  }


  /* =========================
     BOUTONS MÉTÉO
  ========================= */

  document.getElementById(
    'weatherRefresh'
  ).addEventListener(
    'click',
    () => {

      loadWeather(
        'Grenoble'
      );

    }
  );


  document.getElementById(
    'marketRefresh'
  ).addEventListener(
    'click',
    () => {

      loadMarket(
        'CAC 40'
      );

    }
  );


  document.querySelectorAll(
    '[data-weather]'
  ).forEach(
    b => {

      b.addEventListener(
        'click',
        () => {

          loadWeather(
            b.dataset.weather
          );

        }
      );

    }
  );


  /* =========================
     BOUTONS BOURSE
  ========================= */

  document.querySelectorAll(
    '[data-market]'
  ).forEach(
    b => {

      b.addEventListener(
        'click',
        () => {

          loadMarket(
            b.dataset.market
          );

        }
      );

    }
  );


  /* =========================
     DÉMARRAGE
  ========================= */

  loadWeather();

  loadMarket();


  /* =========================
     SERVICE WORKER
  ========================= */

  if(
    'serviceWorker' in navigator
  ){

    navigator.serviceWorker
      .register('/sw.js')
      .catch(
        () => {}
      );

  }

</script>
